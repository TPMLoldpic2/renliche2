<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee7d7">
  <title>人力車 · AR 明信片</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/mindar-image-aframe.prod.js"></script>
  <script src="./model-fit.js"></script>
  <script src="./rickshaw-animation.js?v=1"></script>
  <script src="./gestures.js?v=2"></script>
  <script defer src="./app.js?v=2"></script>
</head>
<body data-view="home">
  <main id="home">
    <section class="postcard">
      <div class="eyebrow">一張照片，一段城市記憶</div>
      <h1>人力車</h1>
      <p class="subtitle">AR 印章明信片</p>
      <img class="photo" src="./assets/target_photo.png" alt="用來辨識的人力車歷史照片">
      <p class="instructions">按下開始，將鏡頭對準這張照片。<br>人力車會出現在照片上，拉車人邁步前進，車輪轉動，乘客坐在車上。</p>
      <p class="note">辨識後，雙指張合縮放，單指拖曳或雙指轉動旋轉。</p>
      <button id="start" type="button" class="primary">開始掃描明信片</button>
      <p id="loadNote" class="note" role="status">準備人力車與動畫中…</p>
      <p id="homeError" class="error" role="alert" hidden></p>
      <p class="note">請在光線充足的地方掃描，並避免照片反光。</p>
    </section>
  </main>

  <div id="arRoot" aria-hidden="true">
    <a-scene id="arScene" embedded
      mindar-image="imageTargetSrc:./assets/targets.mind;autoStart:false;uiLoading:no;uiScanning:no;uiError:no;filterMinCF:0.001;filterBeta:20;warmupTolerance:8;missTolerance:8"
      renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true;antialias:true"
      color-space="sRGB" xr-mode-ui="enabled:false"
      device-orientation-permission-ui="enabled:false">
      <a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
      <a-entity light="type:ambient;color:#ffffff;intensity:1.25"></a-entity>
      <a-entity light="type:directional;color:#fff5df;intensity:2.2" position="1 2 3"></a-entity>
      <a-entity id="photoAnchor" mindar-image-target="targetIndex:0">
        <a-entity id="cityRoot" position="0 0 .006" scale=".95 .95 .95" visible="false">
          <a-entity rotation="90 0 0">
            <a-entity id="cityYaw">
              <a-entity id="cityModel" fit-to-postcard="width:1" rickshaw-animation="speed:1;enabled:false"
                gltf-model="url(./assets/Rickshaw_Animated.glb)"></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </div>

  <section id="scanUI" aria-label="AR 掃描介面" hidden>
    <div id="gestureSurface" aria-hidden="true"></div>
    <div id="trackingStatus" class="status" role="status" aria-live="polite">請對準人力車照片</div>
    <p id="gestureHint" hidden>雙指張合縮放 · 單指拖曳或雙指轉動旋轉</p>
    <div id="scanGuide" aria-hidden="true"><span></span><p>將整張人力車照片放入鏡頭中</p></div>
    <div class="bottomBar">
      <button id="adjust" type="button" aria-controls="modelControls" aria-expanded="false">調整模型</button>
      <button id="stop" type="button">結束掃描</button>
    </div>
    <div id="modelControls" class="controls" hidden>
      <h2>調整人力車</h2>
      <label><input id="animationEnabled" type="checkbox" checked style="display:inline;width:auto;margin:0 8px 0 0">播放人力車與人物動畫</label>
      <div class="settingRow"><span>動畫速度 <output id="animationSpeedValue">1.00×</output></span><div class="stepButtons"><button id="speedSlow" type="button">慢</button><button id="speedNormal" type="button">正常</button><button id="speedFast" type="button">快</button></div></div>
      <div class="settingRow"><span>大小 <output id="sizeValue">0.95</output></span><div class="stepButtons"><button id="sizeDown" type="button" aria-label="縮小模型">−</button><button id="sizeUp" type="button" aria-label="放大模型">＋</button></div></div>
      <div class="settingRow"><span>方向 <output id="yawValue">0°</output></span><div class="stepButtons"><button id="yawLeft" type="button" aria-label="向左旋轉模型">↶</button><button id="yawRight" type="button" aria-label="向右旋轉模型">↷</button></div></div>
      <div class="settingRow"><span>離卡片高度 <output id="heightValue">0.006</output></span><div class="stepButtons"><button id="heightDown" type="button" aria-label="降低模型">−</button><button id="heightUp" type="button" aria-label="升高模型">＋</button></div></div>
      <div class="controlActions"><button id="reset" type="button">恢復預設</button><button id="retryModel" type="button" hidden>重新載入模型</button></div>
      <p>在畫面上雙指張合可縮放；單指左右拖曳或雙指轉動可旋轉。也可使用上方按鈕調整。</p>
    </div>
  </section>
  <noscript>請啟用 JavaScript 後使用 AR 掃描。</noscript>
</body>
</html>
